<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Stats</title>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 20%, rgba(230, 80, 255, 0.24), transparent 34%),
          radial-gradient(circle at 20% 80%, rgba(120, 80, 255, 0.22), transparent 32%),
          #090512;
        color: white;
        font-family: Arial, sans-serif;
      }

      .card {
        width: min(420px, calc(100vw - 40px));
        padding: 34px 28px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 0 50px rgba(220, 80, 255, 0.24);
        text-align: center;
        backdrop-filter: blur(18px);
      }

      h1 {
        margin: 0 0 28px;
        font-size: 28px;
      }

      .label {
        opacity: 0.72;
        font-size: 18px;
      }

      .number {
        margin: 8px 0 26px;
        font-size: 64px;
        line-height: 1;
        font-weight: 800;
      }

      .hint {
        margin-top: 18px;
        opacity: 0.5;
        font-size: 13px;
      }
    </style>
  </head>

  <body>
    <main class="card">
      <h1>AR статистика</h1>

      <div class="label">Сканов сегодня</div>
      <div id="today" class="number">—</div>

      <div class="label">Сканов за всё время</div>
      <div id="total" class="number">—</div>

      <div id="hint" class="hint">Загрузка...</div>
    </main>

    <script>
      const STATS_ENDPOINT = ''

      async function loadStats() {
        const hint = document.querySelector('#hint')

        if (!STATS_ENDPOINT) {
          hint.textContent = 'Добавь URL Cloudflare Worker в stats.html'
          return
        }

        try {
          const response = await fetch(`${STATS_ENDPOINT}/stats`)
          const stats = await response.json()

          document.querySelector('#today').textContent = stats.today ?? 0
          document.querySelector('#total').textContent = stats.total ?? 0

          hint.textContent = `Обновлено: ${new Date().toLocaleTimeString()}`
        } catch (error) {
          console.warn(error)
          hint.textContent = 'Не удалось загрузить статистику'
        }
      }

      loadStats()
      setInterval(loadStats, 10000)
    </script>
  </body>
</html>
