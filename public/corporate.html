<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corporate AR Stats</title>

    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 15%, rgba(255, 90, 230, 0.26), transparent 34%),
          radial-gradient(circle at 20% 85%, rgba(120, 95, 255, 0.24), transparent 32%),
          #090512;
        color: white;
        font-family: Arial, sans-serif;
      }

      .card {
        width: min(520px, calc(100vw - 40px));
        box-sizing: border-box;
        padding: 36px 30px;
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.085);
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 0 60px rgba(225, 80, 255, 0.24);
        text-align: center;
        backdrop-filter: blur(18px);
      }

      .eyebrow {
        margin: 0 0 10px;
        opacity: 0.62;
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 30px;
        font-size: 30px;
        line-height: 1.14;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .metric {
        padding: 24px 18px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .label {
        opacity: 0.72;
        font-size: 18px;
      }

      .number {
        margin: 10px 0 0;
        font-size: 68px;
        line-height: 1;
        font-weight: 800;
      }

      .hint {
        margin-top: 22px;
        opacity: 0.56;
        font-size: 13px;
      }

      .error {
        color: #ffd1f8;
      }
    </style>
  </head>

  <body>
    <main class="card">
      <p class="eyebrow">Corporate dashboard</p>
      <h1>AR статистика сканирований</h1>

      <section class="grid">
        <div class="metric">
          <div class="label">Сканов сегодня</div>
          <div id="today" class="number">—</div>
        </div>

        <div class="metric">
          <div class="label">Сканов за всё время</div>
          <div id="total" class="number">—</div>
        </div>
      </section>

      <div id="hint" class="hint">Загрузка...</div>
    </main>

    <script>
      const STATS_ENDPOINT = 'https://webar-stats.yogerasim.workers.dev'
      const PROJECT = 'webar-mindar-three'
      const TARGET = 'main'

      async function loadStats() {
        const hint = document.querySelector('#hint')

        try {
          const url = `${STATS_ENDPOINT}/stats?project=${encodeURIComponent(PROJECT)}&target=${encodeURIComponent(TARGET)}`
          const response = await fetch(url)

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`)
          }

          const stats = await response.json()

          document.querySelector('#today').textContent = stats.todayCount ?? 0
          document.querySelector('#total').textContent = stats.totalCount ?? 0

          hint.classList.remove('error')
          hint.textContent = `Обновлено: ${new Date().toLocaleTimeString()}`
        } catch (error) {
          console.warn(error)
          hint.classList.add('error')
          hint.textContent = 'Не удалось загрузить статистику'
        }
      }

      loadStats()
      setInterval(loadStats, 10000)
    </script>
  </body>
</html>
