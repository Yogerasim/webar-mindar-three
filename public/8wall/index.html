<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>8th Wall Image Target Test</title>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05020a;
        color: white;
        font-family: Arial, sans-serif;
      }

      #app {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }

      .card {
        width: min(560px, calc(100vw - 40px));
        padding: 28px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 0 50px rgba(225, 80, 255, 0.2);
      }

      h1 {
        margin: 0 0 14px;
        font-size: 28px;
      }

      p {
        opacity: 0.78;
        line-height: 1.45;
      }

      .links {
        display: grid;
        gap: 10px;
        margin-top: 22px;
      }

      a {
        color: #ffd1ff;
      }

      code {
        color: #ffd1ff;
      }
    </style>
  </head>

  <body>
    <main id="app">
      <section class="card">
        <h1>8th Wall Image Target Test</h1>
        <p>
          Этот маршрут готов под тест 8th Wall. Следующий шаг — подключить
          8th Wall self-hosted example и заменить target на наш принт.
        </p>

        <p>
          Текущий путь:
          <br />
          <code>/8wall/</code>
        </p>

        <div class="links">
          <a href="/">Открыть текущую MindAR-версию</a>
          <a href="/corporate.html">Открыть статистику</a>
        </div>
      </section>
    </main>
  </body>
</html>
